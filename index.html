

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أدوات العرب الذكية</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:white}
header{padding:25px 15px;text-align:center;background:#172554}
header h1{color:#38bdf8;margin:10px}
header p{color:#cbd5e1}
main{max-width:800px;margin:30px auto;padding:15px}
.card{background:#1e293b;padding:22px;border-radius:15px;margin-bottom:18px}
h2{color:#38bdf8;font-size:20px}
textarea,input{width:100%;padding:14px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white;font-size:16px;margin:10px 0}
button{background:#0284c7;color:white;border:0;padding:12px 20px;border-radius:9px;font-size:16px;cursor:pointer}
.result{background:#334155;padding:14px;border-radius:9px;min-height:45px;white-space:pre-wrap;overflow-wrap:anywhere}
footer{text-align:center;padding:25px;color:#94a3b8}
</style>
</head>
<body>
<header>
<h1>🤖 أدوات العرب الذكية</h1>
<p>أدوات مجانية تساعدك في حياتك اليومية</p>
</header>
<main>
<div class="card">
<h2>📝 عداد الكلمات</h2>
<textarea id="words" rows="4" placeholder="اكتب النص هنا..."></textarea>
<button onclick="countWords()">احسب الكلمات</button>
<div class="result" id="count">عدد الكلمات سيظهر هنا</div>
</div>

<div class="card">
<h2>✨ منسق النصوص</h2>
<textarea id="formatText" rows="4" placeholder="ضع النص الذي تريد تنسيقه..."></textarea>
<button onclick="formatText()">تنسيق النص</button>
<div class="result" id="formatted">النتيجة ستظهر هنا</div>
</div>

<div class="card">
<h2>💡 مولد الأفكار</h2>
<p>اضغط للحصول على فكرة جديدة للمحتوى.</p>
<button onclick="idea()">اقترح فكرة</button>
<div class="result" id="ideaResult">فكرتك ستظهر هنا</div>
</div>
</main>
<footer>© 2026 أدوات العرب الذكية</footer>
<script>
function countWords(){
let t=document.getElementById('words').value.trim();
let n=t?t.split(/\s+/).length:0;
document.getElementById('count').textContent='عدد الكلمات: '+n;
}
function formatText(){
let t=document.getElementById('formatText').value.trim();
document.getElementById('formatted').textContent=t.replace(/\s+/g,' ');
}
function idea(){
let ideas=['اكتب قصة عن النجاح','قدم نصائح لتوفير الوقت','شارك معلومة تقنية مفيدة','اصنع محتوى عن الذكاء الاصطناعي','اكتب قصة قصيرة مشوقة'];
let i=Math.floor(Math.random()*ideas.length);
document.getElementById('ideaResult').textContent=ideas[i];
}
</script>
</body>
</html>
