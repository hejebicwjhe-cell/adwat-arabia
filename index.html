

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أدوات العرب الذكية</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#0f172a;color:white}
header{text-align:center;padding:30px 15px;background:#172554}
header h1{color:#38bdf8}
main{max-width:800px;margin:25px auto;padding:15px}
.card{background:#1e293b;padding:22px;border-radius:15px;margin-bottom:20px}
h2{color:#38bdf8}
textarea,input,select{width:100%;padding:14px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white;font-size:16px;margin:10px 0}
button{background:#0284c7;color:white;border:0;padding:13px 20px;border-radius:9px;font-size:16px;cursor:pointer;margin:5px}
.result{background:#334155;padding:15px;border-radius:9px;min-height:45px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}
footer{text-align:center;padding:25px;color:#94a3b8}
</style>
</head>
<body>
<header>
<h1>🤖 أدوات العرب الذكية</h1>
<p>أدوات مجانية تساعدك في حياتك اليومية</p>
</header>
<main>

<div class="card">
<h2>📝 عداد الكلمات</h2>
<textarea id="words" placeholder="اكتب النص هنا..."></textarea>
<button onclick="countWords()">احسب الكلمات</button>
<div class="result" id="count">عدد الكلمات سيظهر هنا</div>
</div>

<div class="card">
<h2>✨ منسق النصوص</h2>
<textarea id="formatText" placeholder="ضع النص الذي تريد تنسيقه..."></textarea>
<button onclick="formatText()">تنسيق النص</button>
<div class="result" id="formatted">النتيجة ستظهر هنا</div>
</div>

<div class="card">
<h2>💡 مولد الأفكار</h2>
<button onclick="idea()">اقترح فكرة</button>
<div class="result" id="ideaResult">فكرتك ستظهر هنا</div>
</div>

<div class="card">
<h2>📱 مولد منشورات فيسبوك وتيك توك</h2>
<input id="topic" placeholder="اكتب موضوع المنشور...">
<select id="platform">
<option value="فيسبوك">فيسبوك</option>
<option value="تيك توك">تيك توك</option>
</select>
<select id="tone">
<option value="عفوي">أسلوب عفوي</option>
<option value="قوي">أسلوب قوي</option>
<option value="مضحك">أسلوب مضحك</option>
<option value="تحفيزي">أسلوب تحفيزي</option>
</select>
<button onclick="makePost()">إنشاء المنشور</button>
<div class="result" id="postResult">منشورك سيظهر هنا</div>
<button onclick="copyPost()">📋 نسخ المنشور</button>
</div>

</main>
<footer>© 2026 أدوات العرب الذكية</footer>

<script>
function countWords(){
let t=document.getElementById('words').value.trim();
document.getElementById('count').textContent=
'عدد الكلمات: '+(t?t.split(/\s+/).length:0);
}

function formatText(){
let t=document.getElementById('formatText').value.trim();
document.getElementById('formatted').textContent=
t.replace(/\s+/g,' ');
}

function idea(){
let ideas=[
'اكتب قصة عن النجاح',
'قدم نصائح لتوفير الوقت',
'شارك معلومة تقنية مفيدة',
'اصنع محتوى عن الذكاء الاصطناعي',
'اكتب قصة قصيرة مشوقة',
'شارك موقفاً مضحكاً من الحياة اليومية'
];
let i=Math.floor(Math.random()*ideas.length);
document.getElementById('ideaResult').textContent=ideas[i];
}

function makePost(){
let topic=document.getElementById('topic').value.trim();
let platform=document.getElementById('platform').value;
let tone=document.getElementById('tone').value;

if(!topic){
document.getElementById('postResult').textContent=
'اكتب موضوع المنشور أولاً.';
return;
}

let intros={
'عفوي':'خلونا نحكوا اليوم عن ',
'قوي':'هناك موضوع يستحق أن نتوقف عنده: ',
'مضحك':'يبدو أن موضوع اليوم يستحق الضحك والتفكير 😂: ',
'تحفيزي':'كل بداية جميلة تبدأ بفكرة، واليوم نتحدث عن '
};

let endings={
'عفوي':'شن رأيكم في الموضوع؟ شاركونا آراءكم ❤️',
'قوي':'ما رأيكم؟ النقاش مفتوح.',
'مضحك':'قولولنا رأيكم، بدون مجاملة 😂',
'تحفيزي':'ابدأ بخطوة صغيرة، فالنجاح يحتاج إلى استمرار 💪'
};

let hashtags='#محتوى #العرب #أفكار #'+
topic.replace(/\s+/g,'');

let result=intros[tone]+topic+'\n\n'+
endings[tone]+'\n\n'+hashtags;

document.getElementById('postResult').textContent=
'منشور '+platform+':\n\n'+result;
}

function copyPost(){
let t=document.getElementById('postResult').textContent;
if(!t||t==='منشورك سيظهر هنا')return;
if(navigator.clipboard){
navigator.clipboard.writeText(t).then(()=>{
alert('تم نسخ المنشور');
}).catch(()=>alert('تعذر النسخ، انسخ النص يدوياً'));
}else{
alert('انسخ النص يدوياً');
}
}
</script>
</body>
</html>
